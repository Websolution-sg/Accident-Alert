# Waze API Configuration
waze:
  api_url: "https://www.waze.com/live-map/api/georss"
  
  # Singapore bounding box
  bbox_bottom: 1.1304753
  bbox_left: 103.6055424
  bbox_right: 104.0945619
  bbox_top: 1.4764671
  
  # Shorter intervals for development/testing
  request_timeout: 15
  max_retries: 2
  poll_interval: 30  # seconds (more frequent in dev)

# Geographic Configuration
geographic:
  singapore_north: 1.4784
  singapore_south: 1.1496
  singapore_east: 104.0853
  singapore_west: 103.6065
  
  # Stricter duplicate detection for testing
  duplicate_detection_radius: 50  # meters
  coordinate_precision: 4

# Enhanced monitoring for development
monitoring:
  health_check_interval: 60  # seconds (more frequent)
  log_level: "DEBUG"  # Verbose logging
  log_format: "text"  # Human-readable format
  max_log_file_size: 5242880  # 5MB (smaller files)
  log_backup_count: 3
  
  enable_metrics: true
  metrics_retention: 500
  
  max_errors_tracked: 50
  error_alert_threshold: 5  # Alert sooner in dev

# Database/Storage Configuration
database:
  processed_accidents_file: "processed_accidents_dev.json"
  telegram_offset_file: "telegram_offset_dev.json"
  user_processed_file: "user_processed_accidents_dev.json"
  
  max_processed_records: 1000  # Smaller for dev
  cleanup_interval_hours: 6

# Relaxed security for development
security:
  validate_coordinates: true
  sanitize_messages: false  # Allow more testing flexibility
  max_message_length: 8192  # Allow longer test messages
  
  enable_rate_limiting: false  # Disable for testing
  max_requests_per_minute: 100
  
  # More lenient circuit breaker
  circuit_breaker_failure_threshold: 10
  circuit_breaker_recovery_timeout: 30

# Development deployment info  
deployment_region: "local"
vm_name: "local-dev"
project_id: "development"